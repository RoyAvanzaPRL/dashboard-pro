<div id="news-article" class="flex h-full min-h-0 flex-col gap-4 overflow-hidden bg-[#f3f4f6] px-4 py-6">
  <header class="flex shrink-0 flex-wrap items-end justify-between gap-3 rounded-2xl bg-white px-5 py-4 shadow-[0_1px_2px_rgba(20,24,28,0.04)]">
    <div class="min-w-0">
      <div data-breadcrumbs></div>
      <h1 class="mt-2 text-lg font-semibold">Lectura</h1>
      <p class="text-sm text-mute">Detalle de la pieza seleccionada</p>
    </div>
    <div class="flex shrink-0 items-center gap-2">
      <a id="news-article-prev" href="#/agenda" class="inline-flex h-9 items-center gap-1.5 rounded-lg border border-line px-3 text-sm font-medium hover:bg-[#f6f7f8]">Anterior</a>
      <a id="news-article-next" href="#/agenda" class="inline-flex h-9 items-center gap-1.5 rounded-lg border border-line px-3 text-sm font-medium hover:bg-[#f6f7f8]">Siguiente</a>
    </div>
  </header>

  <div class="grid min-h-0 flex-1 gap-4 overflow-hidden lg:grid-cols-[minmax(0,1fr)_17rem]">
    <article class="flex min-h-0 min-w-0 flex-col overflow-hidden rounded-2xl bg-white shadow-[0_1px_2px_rgba(20,24,28,0.04)]">
      <div class="min-h-0 flex-1 overflow-y-auto px-5 py-5 sm:px-7 sm:py-6">
        <div class="flex flex-wrap items-center gap-2">
          <span id="news-article-category"></span>
          <span id="news-article-source" class="text-xs text-mute"></span>
        </div>
        <h2 id="news-article-title" class="mt-4 max-w-3xl text-2xl font-semibold leading-tight tracking-tight"></h2>
        <p id="news-article-meta" class="mt-2 text-sm text-mute"></p>
        <p id="news-article-summary" class="mt-5 max-w-3xl text-base leading-relaxed text-[#3c424a]"></p>
        <div id="news-article-body" class="news-prose mt-6 max-w-3xl space-y-4 border-t border-line pt-6 text-[15px] leading-relaxed text-[#3c424a]"></div>
        <section id="news-article-impact" class="mt-6 max-w-3xl rounded-2xl bg-mint px-4 py-4" hidden>
          <p class="text-[11px] font-semibold tracking-wide text-tide">PARA EL DESPACHO</p>
          <p id="news-article-impact-text" class="mt-1 text-sm leading-relaxed text-[#1f3d36]"></p>
        </section>
      </div>
    </article>

    <aside class="hidden min-h-0 flex-col gap-4 overflow-y-auto lg:flex">
      <section class="rounded-2xl bg-white px-4 py-4 shadow-[0_1px_2px_rgba(20,24,28,0.04)]">
        <p class="text-xs font-semibold uppercase tracking-wide text-mute">Ficha</p>
        <dl class="mt-3 space-y-3 text-sm">
          <div>
            <dt class="text-[11px] font-semibold tracking-wide text-mute">CATEGORÍA</dt>
            <dd id="news-article-side-cat" class="mt-1 font-medium"></dd>
          </div>
          <div>
            <dt class="text-[11px] font-semibold tracking-wide text-mute">FECHA</dt>
            <dd id="news-article-side-when" class="mt-1"></dd>
          </div>
          <div>
            <dt class="text-[11px] font-semibold tracking-wide text-mute">FUENTE</dt>
            <dd id="news-article-side-source" class="mt-1"></dd>
          </div>
        </dl>
      </section>
      <section class="rounded-2xl bg-white px-4 py-4 shadow-[0_1px_2px_rgba(20,24,28,0.04)]">
        <p class="text-xs font-semibold uppercase tracking-wide text-mute">Misma semana</p>
        <ul id="news-article-related" class="mt-2"></ul>
      </section>
    </aside>
  </div>
</div>
