<div id="convenio-page" class="flex h-full min-h-0 flex-col gap-4 overflow-hidden bg-[#f3f4f6] px-4 py-6">
  <header class="flex shrink-0 flex-wrap items-end justify-between gap-3 rounded-2xl bg-white px-5 py-4 shadow-[0_1px_2px_rgba(20,24,28,0.04)]">
    <div class="min-w-0">
      <div data-breadcrumbs></div>
      <h1 class="mt-2 text-lg font-semibold">Convenio</h1>
      <p id="convenio-org" class="text-sm text-mute"></p>
    </div>
    <a id="convenio-web" href="#" target="_blank" rel="noopener noreferrer" class="inline-flex h-9 items-center rounded-lg border border-line px-3 text-sm font-medium hover:bg-[#f6f7f8]">Abrir sede web</a>
  </header>

  <div class="grid min-h-0 flex-1 gap-4 overflow-hidden lg:grid-cols-[minmax(0,1fr)_17rem]">
    <article class="flex min-h-0 min-w-0 flex-col overflow-hidden rounded-2xl bg-white shadow-[0_1px_2px_rgba(20,24,28,0.04)]">
      <div class="min-h-0 flex-1 overflow-y-auto px-5 py-5 sm:px-7 sm:py-6">
        <span class="inline-flex rounded-full bg-[#e7f6ec] px-2 py-0.5 text-[11px] font-semibold text-[#146c43]">Acuerdo</span>
        <h2 id="convenio-title" class="mt-4 max-w-3xl text-2xl font-semibold leading-tight tracking-tight"></h2>
        <p id="convenio-meta" class="mt-2 text-sm text-mute"></p>
        <p id="convenio-summary" class="mt-5 max-w-3xl text-base leading-relaxed text-[#3c424a]"></p>
        <div id="convenio-body" class="news-prose mt-6 max-w-3xl space-y-4 border-t border-line pt-6 text-[15px] leading-relaxed text-[#3c424a]"></div>
        <section class="mt-6 max-w-3xl rounded-2xl bg-[#e7f6ec] px-4 py-4">
          <p class="text-[11px] font-semibold tracking-wide text-[#146c43]">DOCUMENTO</p>
          <p id="convenio-doc" class="mt-1 text-sm font-medium"></p>
          <p id="convenio-doc-meta" class="mt-1 text-sm text-[#3d5c4a]"></p>
        </section>
      </div>
    </article>

    <aside class="hidden min-h-0 flex-col gap-4 overflow-y-auto lg:flex">
      <section class="rounded-2xl bg-white px-4 py-4 shadow-[0_1px_2px_rgba(20,24,28,0.04)]">
        <p class="text-xs font-semibold uppercase tracking-wide text-mute">Ficha</p>
        <dl class="mt-3 space-y-3 text-sm">
          <div>
            <dt class="text-[11px] font-semibold tracking-wide text-mute">ORGANISMO</dt>
            <dd id="convenio-side-org" class="mt-1 font-medium"></dd>
          </div>
          <div>
            <dt class="text-[11px] font-semibold tracking-wide text-mute">VIGENCIA</dt>
            <dd id="convenio-side-term" class="mt-1"></dd>
          </div>
          <div>
            <dt class="text-[11px] font-semibold tracking-wide text-mute">FORMATO</dt>
            <dd class="mt-1">PDF</dd>
          </div>
        </dl>
      </section>
      <section class="rounded-2xl bg-white px-4 py-4 shadow-[0_1px_2px_rgba(20,24,28,0.04)]">
        <p class="text-xs font-semibold uppercase tracking-wide text-mute">Documentos del acuerdo</p>
        <ul id="convenio-related" class="mt-2"></ul>
      </section>
    </aside>
  </div>
</div>
