<div id="tabla4" class="flex h-full min-h-0 flex-col overflow-hidden px-7 pb-5 pt-6">
  <div class="flex items-center justify-between gap-4">
    <div>
      <h1 class="text-lg font-semibold">Tabla 4</h1>
      <p id="tabla4-count" class="text-sm text-mute">14 elementos</p>
    </div>
    <div class="flex items-center gap-2">
      <form id="tabla4-search" class="relative">
        <svg viewBox="0 0 24 24" class="line pointer-events-none absolute left-3 top-1/2 size-4 -translate-y-1/2 text-mute"><circle cx="11" cy="11" r="6"></circle><path d="m16 16.5 4 4"></path></svg>
        <label class="sr-only" for="tabla4-q">Buscar</label>
        <input id="tabla4-q" type="search" placeholder="Buscar" class="w-56 rounded-lg bg-[#f3f4f6] py-2 pl-9 pr-3 text-sm outline-none placeholder:text-mute" />
      </form>
      <button type="button" data-open="tabla4-sheet" class="rounded-lg bg-tide px-3 py-2 text-sm font-semibold text-white">+ Elemento</button>
    </div>
  </div>
  <div id="tabla4-filters" class="mt-3 flex flex-wrap items-center gap-2"></div>
  <div id="tabla4-scroller" class="mt-3 min-h-0 flex-1 overflow-x-auto overflow-y-auto">
    <div class="min-w-[36rem]">
      <div id="tabla4-head"></div>
      <div id="tabla4-body"></div>
      <p id="tabla4-empty" hidden class="px-2 py-8 text-sm text-mute">Ningún elemento coincide con este filtro.</p>
    </div>
  </div>
  <div id="tabla4-sheet" hidden class="fixed inset-0 z-40 grid place-items-center bg-ink/30">
    <form class="w-[420px] rounded-2xl bg-white p-5 shadow-[0_24px_60px_rgba(20,24,28,0.18)]">
      <h2 class="text-lg font-semibold">Nuevo elemento</h2>
      <div id="tabla4-fields" class="mt-4 grid gap-3"></div>
      <div class="mt-4 flex justify-end gap-3">
        <button type="button" data-close class="text-sm font-medium">Cerrar</button>
        <button type="submit" class="rounded-lg bg-tide px-3 py-2 text-sm font-semibold text-white">Añadir</button>
      </div>
    </form>
  </div>
</div>
